<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Manşet</title>
<style>
:root{--bg:#eef1f5;--bg2:#dfe5ee;--card:#fff;--ink:#14213d;--mute:#5b6678;--line:#d5dbe5;--red:#d62839;--grn:#2a9d5c;--gold:#e9a820;--btn:#14213d;--btnt:#fff;--bar:#14213d;--ts:1;--sh:0 6px 24px rgba(20,33,61,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--bg2:#17223f;--card:#16203a;--ink:#eef1f8;--mute:#9aa6bf;--line:#2a3555;--red:#ff5a69;--btn:#eef1f8;--btnt:#0d1424;--bar:#eef1f8;--sh:0 6px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0d1424;--bg2:#17223f;--card:#16203a;--ink:#eef1f8;--mute:#9aa6bf;--line:#2a3555;--red:#ff5a69;--btn:#eef1f8;--btnt:#0d1424;--bar:#eef1f8;--sh:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{min-height:100vh;background-image:radial-gradient(circle at 50% -20%,var(--bg2),transparent 70%)}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(var(--line) 1px,transparent 1.3px);background-size:20px 20px;opacity:.5;pointer-events:none;z-index:0}
input{-webkit-user-select:text;user-select:text}
.w{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:16px 16px 120px}
h1,h2{font-family:Rockwell,"Roboto Slab",Georgia,serif;margin:0}
.noanim *,.noanim *::before{animation:none!important;transition:none!important}

/* üst başlık */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top h1{font-size:28px;letter-spacing:-.5px}
.day{color:var(--mute);font-size:13px;margin-top:2px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.pb{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:-2px 0 12px}
.pb i{display:block;height:100%;background:var(--gold);transition:width .4s}
.kb{margin:0 0 10px}.kb .pb{margin:6px 0 0}.kt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--mute)}.kt b{color:var(--ink);font-size:13px}
.fp{background:#f6f0e1;color:#1b1b1b;border:1px solid #cfc6ad;border-radius:6px;padding:12px 14px 14px;margin:10px 0 14px;box-shadow:0 4px 14px rgba(0,0,0,.14);position:relative;font-family:Georgia,"Times New Roman",serif;animation:fpin .5s cubic-bezier(.2,.9,.3,1.2)}
.fpm{text-align:center;border-bottom:3px double #1b1b1b;padding-bottom:6px;margin-bottom:8px}
.fpm b{display:block;font-size:24px;letter-spacing:1px;text-transform:uppercase;line-height:1.1}
.fpm span{display:block;font:11px system-ui,sans-serif;opacity:.7;margin-top:3px;letter-spacing:.5px}
.fpk{font:700 10px system-ui,sans-serif;letter-spacing:2px;color:#b3202f;margin-bottom:4px}
.fph{font-weight:800;font-size:23px;line-height:1.15;margin:0 0 6px}
.fps{font-size:13px;line-height:1.4;opacity:.8;margin:0 0 10px}
.fpi{height:68px;border-radius:3px;border:1px solid #cfc6ad;background:repeating-linear-gradient(45deg,#d9d0b8,#d9d0b8 6px,#e4dcc6 6px,#e4dcc6 12px);display:flex;align-items:center;justify-content:center;font-size:34px}
.fpv{position:absolute;top:-10px;right:10px;background:#d62839;color:#fff;font:800 11px system-ui,sans-serif;letter-spacing:1px;padding:4px 9px;border-radius:4px;transform:rotate(3deg);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.fpv.neg{background:#8a5d00}
@keyframes fpin{from{opacity:0;transform:translateY(14px) rotate(-1.2deg)}}
.vr{display:flex;gap:10px;align-items:center;border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px;font-weight:700;background:linear-gradient(90deg,rgba(214,40,57,.14),rgba(233,168,32,.14));border:1px solid var(--red)}
.vr.neg{background:rgba(233,168,32,.12);border-color:var(--gold)}
.vr small{display:block;font-weight:500;color:var(--mute);font-size:12px;margin-top:2px}
.tj{margin:6px 0 10px}.tjh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--mute)}.tjh b{color:var(--ink);font-size:17px}.tjh small{font-size:12px}
.tjg{width:100%;height:46px;display:block;margin-top:4px}
.rc{margin-top:12px}.rct{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.rci{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.rca{font-size:22px;line-height:1}.rci b{font-size:13px}.rci p{margin:2px 0 0!important;font-size:14px;line-height:1.35}.rci em{font-style:normal;font-size:12px;color:var(--mute);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.fp{animation:none}}

/* göstergeler */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.st3{background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:0 2px 10px rgba(20,33,61,.06)}
.sn{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.sv{font-family:Rockwell,"Roboto Slab",Georgia,serif;font-size:26px;font-weight:700;line-height:1.1;margin:2px 0 6px}
.dd{font-style:normal;font-weight:700;font-size:12px;animation:pop .6s}
.dd.pos{color:var(--grn)}.dd.neg{color:var(--red)}
.tr{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:3px}
.tr i{display:block;height:100%;background:var(--bar);width:50%;transition:width .4s}
.tr i.lo{background:var(--red)}
.warn{min-height:22px;color:var(--red);font-size:14px;font-weight:600;margin:6px 0 10px}
.warn.on{background:rgba(214,40,57,.12);padding:8px 12px;border-radius:12px}

/* kartlar */
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--sh)}
.card h2{font-size:calc(20px*var(--ts));line-height:1.35;margin-bottom:16px}
.card p{line-height:1.5;margin:0 0 10px;font-size:calc(15px*var(--ts))}
.b{display:block;width:100%;text-align:left;font:inherit;font-size:calc(16px*var(--ts));line-height:1.35;padding:13px 14px;margin-top:10px;background:var(--btn);color:var(--btnt);border:0;border-radius:14px;cursor:pointer}
.b:focus-visible,.big:focus-visible,.tile:focus-visible,.mb:focus-visible,.ic:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.b:active{transform:scale(.99)}
.opt{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:600}
.opt:hover{border-color:var(--ink)}
.st{color:var(--mute);font-size:14px;margin:12px 0}
.nt{color:var(--mute);font-size:calc(14px*var(--ts))!important;margin:10px 0 0!important}
.chip{display:inline-block;font-size:14px;font-weight:700;padding:4px 10px;border-radius:12px;margin:0 6px 6px 0;border:1px solid var(--line)}
.dn{color:var(--red)}
.hint{color:var(--mute);font-size:13px;line-height:1.5;margin:4px 2px 10px}

/* oyun tarzı büyük butonlar */
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font:inherit;font-weight:800;font-size:calc(20px*var(--ts));letter-spacing:.5px;text-transform:uppercase;color:#fff;background:linear-gradient(180deg,#ef4456,var(--red));border:0;border-radius:18px;padding:17px 16px;cursor:pointer;box-shadow:0 5px 0 #8f1624,0 12px 22px rgba(214,40,57,.28);margin-top:14px;transition:transform .08s,box-shadow .08s}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #8f1624,0 4px 10px rgba(214,40,57,.25)}
.big small{display:block;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;opacity:.85}
.big.sec{background:var(--card);color:var(--ink);font-size:calc(16px*var(--ts));box-shadow:0 5px 0 var(--line),0 10px 18px rgba(20,33,61,.08)}
.big.sec:active{box-shadow:0 1px 0 var(--line)}
.big[disabled]{opacity:.6;cursor:default}
.big.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.tile{position:relative;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;cursor:pointer;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:3px;transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile .ti{font-size:28px;line-height:1.2}
.tile b{font-family:Rockwell,"Roboto Slab",Georgia,serif;font-size:calc(17px*var(--ts))}
.tile small{color:var(--mute);font-size:12px}
.tile .tg{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px}

/* ana menü */
.topbar{display:flex;align-items:center;gap:10px}
.prof{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 14px 8px 8px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.prof:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.pi{min-width:0;flex:1}
.pi b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi small{color:var(--mute);font-size:12px}
.xp{height:6px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f4c95d);border-radius:3px}
.ib{display:flex;gap:8px}
.ic{width:46px;height:46px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:19px;cursor:pointer;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center;padding:0}
.ic:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.av{flex:none;width:46px;height:46px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:22px}
.mast{padding:20px 0 6px;text-align:center}
.dl{display:flex;justify-content:space-between;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mute);border-top:4px double var(--ink);border-bottom:1px solid var(--ink);padding:7px 2px}
.mast h1{font-size:68px;line-height:1;letter-spacing:-2px;text-transform:uppercase;margin:20px 0 8px}
.mast p{font-family:Georgia,serif;font-style:italic;color:var(--mute);font-size:17px;margin:0 0 4px}
.tick{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);margin:10px 0 4px;font-size:13px}
.tick>b{background:var(--red);color:#fff;padding:8px 10px;letter-spacing:1px;font-size:11px;white-space:nowrap;display:flex;align-items:center}
.tick>div{overflow:hidden;flex:1;display:flex;align-items:center}
.tick>div span{display:inline-block;white-space:nowrap;padding-left:100%;animation:tk 60s linear infinite;color:var(--mute)}
@keyframes tk{to{transform:translateX(-100%)}}
.ft{text-align:center;color:var(--mute);font-size:12px;margin-top:24px;letter-spacing:1px}

/* açılış */
.splash{min-height:82vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.splash .lg{font-size:76px;animation:pop .8s}
.splash h1{font-size:62px;letter-spacing:-2px;text-transform:uppercase;margin:6px 0}
.splash p{font-family:Georgia,serif;font-style:italic;color:var(--mute);font-size:17px;margin:0}
.ld{width:70%;height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:28px 0 4px}
.ld i{display:block;height:100%;width:100%;background:var(--red);animation:ldb 1.3s linear}
@keyframes ldb{from{width:0}}
.splash .big{max-width:320px}

/* alt sayfalar */
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.hd h1{font-size:26px;flex:1}
.sect{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mute);margin:22px 4px 8px;font-weight:700}
.mb{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:10px;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.mb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mb .mi{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line);font-size:20px}
.mb .mt{flex:1;display:flex;flex-direction:column;gap:3px}
.mb .mt b{font-family:Rockwell,"Roboto Slab",Georgia,serif;font-size:calc(19px*var(--ts))}
.mb .mt small{color:var(--mute);font-size:13px;line-height:1.35}
.mb .ar{color:var(--mute);font-size:26px;line-height:1}
.mb.pri{background:linear-gradient(180deg,#ef4456,var(--red));border-color:var(--red);color:#fff;box-shadow:0 5px 0 #8f1624}
.mb.pri:active{box-shadow:0 1px 0 #8f1624}
.mb.pri .mi{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35)}
.mb.pri .mt small,.mb.pri .ar{color:rgba(255,255,255,.88)}

/* ayarlar */
.grp{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:2px 14px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.ri{flex:none;width:38px;height:38px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:19px}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:calc(15px*var(--ts))}
.rt small{display:block;color:var(--mute);font-size:12px;line-height:1.35;margin-top:2px}
.seg{display:inline-flex;background:var(--bg);border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:none;color:var(--mute);font:inherit;font-size:13px;font-weight:700;padding:8px 10px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg.full{display:flex;width:100%}
.seg.full button{flex:1;padding:11px 4px}
.sw{flex:none;width:52px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;cursor:pointer;transition:background .2s;padding:0}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:var(--grn)}
.sw.on i{transform:translateX(22px)}
.in{width:130px;font:inherit;font-size:15px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.dng{flex:none;font:inherit;font-size:13px;font-weight:700;color:var(--red);background:none;border:1px solid var(--red);border-radius:10px;padding:8px 12px;cursor:pointer}

/* sonlar / profil */
.eg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ec{background:var(--card);border-radius:18px;padding:14px 10px;box-shadow:var(--sh);text-align:center}
.ec.lk{opacity:.55}
.ec .ei{font-size:36px;line-height:1.2}
.ec b{display:block;font-family:Rockwell,"Roboto Slab",Georgia,serif;margin:4px 0;font-size:calc(16px*var(--ts))}
.ec small{color:var(--mute);font-size:12px;line-height:1.35;display:block}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.sg div{background:var(--bg);border-radius:12px;padding:8px 2px;text-align:center}
.sg b{display:block;font-size:18px}
.sg small{font-size:11px;color:var(--mute)}
.sec{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border:0}
.sec span{color:var(--mute);font-size:14px}
.how{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.how:last-child{border:0}
.how .hi{flex:none;font-size:24px;width:34px;text-align:center}
.how b{display:block;margin-bottom:2px}
.how span{color:var(--mute);font-size:calc(14px*var(--ts));line-height:1.5}

/* ekip / yatırım */
.cr{margin-bottom:12px;padding:16px}
.cr.off{opacity:.5}
.ch{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.ci b{display:block;font-family:Rockwell,"Roboto Slab",Georgia,serif;font-size:17px}
.ci small{color:var(--mute);font-size:13px}
.act{display:block;width:100%;text-align:left;font:inherit;color:var(--btnt);background:var(--btn);border:0;border-radius:14px;padding:11px 14px;margin-top:10px;cursor:pointer}
.act b{display:block;font-size:15px}
.act small{opacity:.8;font-size:12px}
.act.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.act[disabled]{opacity:.45;cursor:default}
.act:not([disabled]):active,.up:not([disabled]):active{transform:scale(.98)}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:4px;box-shadow:0 2px 10px rgba(20,33,61,.06)}
.up .ui{font-size:28px}.up b{font-size:15px}.up small{color:var(--mute);font-size:12px;line-height:1.35;flex:1}
.up em{font-style:normal;font-weight:700;font-size:13px;margin-top:6px;color:var(--red)}
.up.own{border-color:var(--grn)}.up.own em{color:var(--grn)}
.up[disabled]:not(.own){opacity:.5}.up[disabled]{cursor:default}

/* alt menü ve bildirim */
.nv{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:5}
.nvi{pointer-events:auto;display:flex;gap:4px;background:var(--card);border-radius:22px;box-shadow:0 8px 30px rgba(20,33,61,.18);padding:6px;border:1px solid var(--line)}
.nvi button{flex:1;position:relative;background:none;border:0;color:var(--mute);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:16px;cursor:pointer}
.nvi button span{font-size:20px;line-height:1}
.nvi button.on{background:var(--red);color:#fff}
.nvi button:focus-visible{outline:3px solid var(--ink)}
.bd{position:absolute;top:6px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--red)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:90%;text-align:center;animation:tst 2.4s forwards;z-index:6;pointer-events:none}
@keyframes tst{0%{opacity:0;transform:translate(-50%,10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* oyun sonu */
.end{text-align:center}
.eb{font-size:68px;line-height:1.1;animation:pop .6s}
.end h2{font-size:30px;color:var(--red);margin:6px 0 10px}
.end p{font-size:calc(17px*var(--ts));line-height:1.5}
.nw{display:inline-block;background:rgba(233,168,32,.18);color:var(--gold);font-weight:800;font-size:13px;padding:5px 12px;border-radius:12px;margin:2px 4px 8px}

@keyframes pop{from{transform:scale(1.7);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.card,.mb,.hint,.act,.up,.tile,.ec,.grp{animation:rise .25s ease}
@media (prefers-reduced-motion:reduce){.card,.mb,.hint,.act,.up,.dd,.toast,.tile,.ec,.grp,.splash .lg,.eb,.big.pulse{animation:none}.tick>div span{animation:none;padding-left:10px}}
.gd{display:flex;gap:10px;align-items:flex-start;margin:12px 0}
.gav{width:58px;height:58px;font-size:34px;flex:none;background:var(--card);border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;animation:pop .5s}
